[project]
name = "spx-calendar-trader"
version = "0.1.0"
description = "Find and paper-trade ~40-delta SPX put calendars using Schwab option chains."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
serve = "app.main:serve"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]          # httpx: FastAPI's TestClient
mockups = ["playwright>=1.45", "matplotlib>=3.8"]   # docs/mockups only, not the app

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
