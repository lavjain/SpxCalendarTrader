{# OpenDialog: confirm a paper trade. Everything shown is filled in by opentrade.js from /api/quote-spread; no math here. #}
<dialog id="open-dialog" class="rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-inherit p-0 w-[28rem] max-w-[95vw]"
        data-interval-ms="{{ quote_interval_s * 1000 }}">
  <form method="dialog" id="open-form" class="p-4 space-y-3">
    <div>
      <h2 class="text-lg font-semibold" id="od-title">Open Trade</h2>
      <div class="text-sm muted" id="od-sub"></div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="tile"><div class="label">Bid</div><div class="value" id="od-bid">—</div></div>
      <div class="tile"><div class="label">Mid</div><div class="value" id="od-mid">—</div></div>
      <div class="tile"><div class="label">Ask</div><div class="value" id="od-ask">—</div></div>
    </div>
    <div class="text-xs muted" id="od-time">Getting a live quote…</div>
    <label class="block text-sm">Fill Price <span class="muted">(Suggested <span id="od-suggested">—</span> = Mid + {{ fill_offset | money }})</span>
      <input id="od-price" type="number" step="0.05" min="0.01" class="mt-1 w-full rounded border border-slate-300 dark:border-slate-600 bg-transparent px-2 py-1">
    </label>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="tile"><div class="label">Contracts</div><div class="value" id="od-contracts">—</div></div>
      <div class="tile"><div class="label">Cost</div><div class="value" id="od-cost">—</div></div>
      <div class="tile"><div class="label">Margin</div><div class="value" id="od-margin">—</div></div>
    </div>
    <div id="od-note" class="text-sm text-amber-600 dark:text-amber-400 hidden" role="status"></div>
    <div id="od-error" class="text-sm text-red-600 dark:text-red-300 hidden" role="alert"></div>
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" class="btn btn-light" id="od-copy">⧉ Copy to TOS</button>
      <button type="button" class="btn btn-light" id="od-paste">Paste from TOS</button>
      <span class="ml-auto"></span>
      <button type="button" class="btn" id="od-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="od-confirm" disabled>Confirm Open</button>
    </div>
  </form>
</dialog>
