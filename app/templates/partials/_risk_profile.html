{# Risk Profile tab: the canvas is painted by static/js/charts/riskgraph.js from /api/risk-profile. #}
<div id="risk-box" data-snapshot-id="{{ snapshot_id }}" data-short="{{ pair.short_expiry }}" data-long="{{ pair.long_expiry }}" data-strike="{{ row.strike }}">
  <div class="flex flex-wrap items-center gap-2 text-sm">
    <span class="muted">Range ±</span>
    {% for r in (150, 300, 500) %}<button type="button" class="chip{% if r == 300 %} chip-on{% endif %}" data-range="{{ r }}">{{ r }}</button>{% endfor %}
    <span class="ml-auto flex items-center gap-3 muted text-xs">
      <span><span class="inline-block w-3 h-0.5 align-middle bg-primary"></span> Today</span>
      <span><span class="inline-block w-3 h-0.5 align-middle" style="background:#16a34a"></span> At Short Expiry</span>
      <span>Shaded: ±1 SD</span>
    </span>
  </div>
  <div id="risk-error" class="hidden text-sm text-amber-600 mt-2"></div>
  <canvas id="risk-canvas" class="w-full mt-2" style="height:320px" aria-label="Risk profile: P/L over SPX"></canvas>
  <div class="muted text-xs">Hover for values · Scroll to zoom · Drag to pan · Double-click to reset</div>
</div>
