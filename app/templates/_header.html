<header class="flex items-center gap-6 px-4 py-2 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
  <div class="font-semibold">SPX Calendar Trader <span class="text-xs font-normal text-slate-500 dark:text-slate-400">v{{ version }}</span></div>
  <nav class="flex gap-1 text-sm">
    <a href="/finder" class="px-3 py-1 rounded {{ 'bg-primary text-white' if active_tab == 'finder' else 'hover:bg-slate-200 dark:hover:bg-slate-700' }}">Finder</a>
    <span class="px-3 py-1 rounded text-slate-400 dark:text-slate-500 cursor-not-allowed" title="Coming in week 4">Holdings</span>
    <span class="px-3 py-1 rounded text-slate-400 dark:text-slate-500 cursor-not-allowed" title="Coming in week 5">Performance</span>
    {% if feature_analyzer %}<span class="px-3 py-1 rounded text-slate-400 dark:text-slate-500 cursor-not-allowed">Analyzer</span>{% endif %}
  </nav>
  <div class="ml-auto flex items-center gap-3 text-sm">
    <span class="px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700">{{ account }}</span>
    <button id="theme-toggle" type="button" class="btn" title="Switch between dark and light (remembered in this browser)">◐ Theme</button>
  </div>
</header>
